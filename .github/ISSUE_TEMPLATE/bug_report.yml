name: Bug report
description: Something in PRISM is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Architecture is frozen
        (see docs/ARCHITECTURE_FREEZE.md); bugs that require architectural
        changes should be discussed in a feature request first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop (Tauri / React)
        - Backend (FastAPI)
        - Code-OSS integration
        - Docker / infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PRISM version / commit
      placeholder: e.g. 1.0.0-rc.1 or commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
