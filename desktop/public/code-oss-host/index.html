<!DOCTYPE html>
<!--
  PRISM Editor Host

  Embeds the unmodified editing-engine workbench in an iframe and translates
  the PRISM Workspace Adapter protocol (v1) without patching upstream sources.

  Query params:
    workbench = absolute URL of the workbench (internal; never shown in UI)
    folder    = optional folder URI to open on load
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRISM Editor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ccc; font-family: system-ui, sans-serif; }
    #root { display: flex; flex-direction: column; height: 100%; }
    #banner { display: none; }
    #frame { flex: 1; border: 0; width: 100%; background: #1e1e1e; min-height: 0; }
    #frame.hidden { display: none; }
  </style>
</head>
<body>
  <div id="root">
    <div id="banner" aria-hidden="true"></div>
    <iframe id="frame" title="PRISM Editor" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
    const PROTOCOL_V = 1;
    const MSG = {
      PING: 'prism.editor.ping',
      OPEN_WORKSPACE: 'prism.editor.openWorkspace',
      OPEN_FILE: 'prism.editor.openFile',
      FOCUS: 'prism.editor.focus',
      DISPOSE: 'prism.editor.dispose',
      READY: 'prism.editor.ready',
      PONG: 'prism.editor.pong',
      ACTIVE_EDITOR: 'prism.editor.activeEditor',
      WORKSPACE_OPENED: 'prism.editor.workspaceOpened',
      ERROR: 'prism.editor.error',
    };

    const USER_ERROR =
      'The editor could not start. Retry, or open a workspace folder again.';

    const params = new URLSearchParams(location.search);
    const defaultWorkbench = params.get('workbench') || 'http://localhost:8080/';
    const initialFolder = params.get('folder') || '';

    const state = {
      workbenchBase: defaultWorkbench.replace(/\/?$/, '/'),
      folderUri: initialFolder || null,
      ready: false,
      lastFileUri: null,
      loadGen: 0,
    };

    const frame = document.getElementById('frame');

    function envelope(type, payload) {
      return { v: PROTOCOL_V, type, payload };
    }

    function post(type, payload) {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage(envelope(type, payload), '*');
    }

    function buildWorkbenchUrl(folderUri) {
      const url = new URL(state.workbenchBase);
      if (folderUri) {
        url.searchParams.set('folder', folderUri);
      }
      return url.toString();
    }

    function loadWorkbench(folderUri) {
      const next = buildWorkbenchUrl(folderUri || state.folderUri);
      state.loadGen += 1;
      const gen = state.loadGen;
      frame.classList.remove('hidden');
      frame.src = next;
      // Validate assets after navigation — READY must mean a renderable workbench.
      void validateWorkbenchAssets(gen);
    }

    async function probeOnce() {
      const sameOrigin =
        state.workbenchBase.startsWith(location.origin) ||
        state.workbenchBase.startsWith('/');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      try {
        const res = await fetch(state.workbenchBase, {
          method: 'GET',
          mode: sameOrigin ? 'cors' : 'no-cors',
          signal: controller.signal,
          cache: 'no-store',
        });
        clearTimeout(timer);
        if (sameOrigin) return res.ok;
        return true;
      } catch {
        clearTimeout(timer);
        return false;
      }
    }

    async function probeWorkbench() {
      const attempts = 12;
      for (let i = 0; i < attempts; i++) {
        if (await probeOnce()) return true;
        if (i < attempts - 1) {
          await new Promise((r) => setTimeout(r, 1000));
        }
      }
      return false;
    }

    /** Confirm ESM or AMD workbench bundles exist (avoids false READY on blank HTML). */
    async function workbenchAssetsOk() {
      const base = state.workbenchBase.replace(/\/?$/, '/');
      const candidates = [
        'static/build/out/vs/workbench/workbench.web.main.internal.js',
        'static/build/out/vs/workbench/workbench.web.main.js',
        'static/build/out/vs/loader.js',
      ];
      for (const rel of candidates) {
        try {
          const res = await fetch(base + rel, { method: 'HEAD', cache: 'no-store' });
          if (res.ok) return true;
        } catch {
          /* try next */
        }
      }
      // HEAD may be blocked cross-origin — try GET range via no-cors probe of internal JS.
      try {
        const res = await fetch(base + candidates[0], {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
        });
        // opaque success means the network answered; treat as ok only if not failed.
        return res.type === 'opaque' || res.ok;
      } catch {
        return false;
      }
    }

    async function validateWorkbenchAssets(gen) {
      // Give the server a moment after iframe navigation.
      await new Promise((r) => setTimeout(r, 400));
      if (gen !== state.loadGen) return;
      const ok = await workbenchAssetsOk();
      if (gen !== state.loadGen) return;
      if (!ok) {
        post(MSG.ERROR, { message: USER_ERROR });
        frame.classList.add('hidden');
        return;
      }
      markReady();
    }

    function markReady() {
      if (state.ready) return;
      state.ready = true;
      post(MSG.READY, {
        engine: 'code-oss-web',
        version: 'workbench',
        capabilities: {
          openWorkspace: 'navigate',
          openFile: 'partial',
          activeEditor: 'unavailable-cross-origin',
          focus: true,
          monaco: true,
          extensionHost: 'workbench-managed',
          explorer: 'workbench',
          editorTabs: 'workbench',
          terminal: 'workbench',
          problems: 'workbench',
          search: 'workbench',
        },
      });
      if (state.folderUri) {
        post(MSG.WORKSPACE_OPENED, { folderUri: state.folderUri });
      }
    }

    function openWorkspace(payload) {
      const folderUri = payload && payload.folderUri;
      if (!folderUri) {
        post(MSG.ERROR, { message: 'openWorkspace requires folderUri' });
        return;
      }
      state.folderUri = folderUri;
      state.ready = false;
      loadWorkbench(folderUri);
      post(MSG.WORKSPACE_OPENED, { folderUri });
    }

    function openFile(payload) {
      const uri = payload && payload.uri;
      if (!uri) {
        post(MSG.ERROR, { message: 'openFile requires uri' });
        return;
      }
      state.lastFileUri = uri;
      try {
        const url = new URL(state.workbenchBase);
        if (state.folderUri) url.searchParams.set('folder', state.folderUri);
        url.searchParams.set('file', uri);
        state.loadGen += 1;
        frame.src = url.toString();
      } catch (e) {
        post(MSG.ERROR, { message: USER_ERROR });
        return;
      }
      post(MSG.ACTIVE_EDITOR, {
        uri,
        language: payload.language,
        dirty: false,
        title: payload.title || uri.split('/').pop() || uri,
      });
    }

    // Do NOT mark ready on bare iframe load — error documents also fire load.
    frame.addEventListener('load', () => {
      /* readiness confirmed via validateWorkbenchAssets */
    });

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || data.v !== PROTOCOL_V || typeof data.type !== 'string') return;
      switch (data.type) {
        case MSG.PING:
          post(MSG.PONG);
          break;
        case MSG.OPEN_WORKSPACE:
          openWorkspace(data.payload || {});
          break;
        case MSG.OPEN_FILE:
          openFile(data.payload || {});
          break;
        case MSG.FOCUS:
          try { frame.contentWindow && frame.contentWindow.focus(); } catch (_) {}
          frame.focus();
          break;
        case MSG.DISPOSE:
          frame.src = 'about:blank';
          state.ready = false;
          break;
        default:
          break;
      }
    });

    (async function boot() {
      const up = await probeWorkbench();
      if (!up) {
        post(MSG.ERROR, { message: USER_ERROR });
        frame.classList.add('hidden');
        return;
      }
      const assets = await workbenchAssetsOk();
      if (!assets) {
        post(MSG.ERROR, { message: USER_ERROR });
        frame.classList.add('hidden');
        return;
      }
      loadWorkbench(state.folderUri);
    })();
  </script>
</body>
</html>
